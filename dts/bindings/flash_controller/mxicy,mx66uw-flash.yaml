description: Macronix MX66UWXXXX flash memory

compatible: "mxicy,mx66uw-flash"

include: flash-controller.yaml

properties:
  erase-value:
    type: int
    description: value that flash memory contains after erase
    required: true
    default: 0xff

  num-of-sector:
    type: int
    description: available sectors in the connected NOR Flash
    required: true

  page-size:
    type: int
    description: page size
    required: true

  sector-size:
    type: int
    description: number of bytes in each sector
    required: true

  write-block-size:
    type: int
    description: minimum number of bytes for read and write
    required: true

  def-wait-cycle:
    type: int
    required: true
    enum: [6, 8, 10, 12, 14, 16, 18, 20]
    description: |
      Flash read dummy clocks.
      Maximum supported clock frequency for Octal STR and DTR operation:
        6 clocks: 66 MHz
        8 clocks: 84 MHz
        10 clocks: 104 MHz
        12 clocks: 133 MHz
        14 clocks: 155 MHz
        16 clocks: 166 MHz
        18 clocks: 173 MHz
        20 clocks: 200 MHz

  read-wait-cycle:
    type: int
    description: number of wait cycles before sampling data depends on the bus speed
    required: true

