description: Synopsys Designware OSPI controller.

compatible: "snps,designware-ospi"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  aes-reg:
    type: array
    description: register space
    required: true

  bus-speed:
    type: int
    required: true
    description: speed

  clock-frequency:
    type: int
    description: Input clock frequency

  cs-pin:
    type: int
    description: slave connected pin
    required: true

  ddr-drive-edge:
    type: int
    description: control the driving edge of TXD in DDR mode
    default: 1

  rx-ds-delay:
    type: int
    description: receive datastrobe delay
    default: 16

  enable-signal-delay:
    type: boolean
    description: |
      Enable/Disable signal delay for higher frequency
      This is used to enable/disable the signal delay for higher frequency operation.
      When enabled, the controller will add a delay to the signals to meet timing requirements.
      When disabled, the controller will not add any delay to the signals.

  txd-delays:
    type: array
    description: |
      Output data lines 0 through 15, in delay taps (0 through 23, approximately 350 ps each).
      Must contain exactly 16 entries.

  rxd-delays:
    type: array
    description: |
      Input data lines 0 through 15, in delay taps (0 through 23, approximately 350 ps each).
      Must contain exactly 16 entries.

  ssi-oe-n-delays:
    type: array
    description: |
      Data output-enable lines 0 through 15, in delay taps (0 through 23, approximately 350 ps each).
      Must contain exactly 16 entries.

  rx-ds-delays:
    type: array
    description: |
      Read strobes 0 and 1, in delay taps (0 through 23, approximately 350 ps each).
      Must contain exactly 2 entries.

  txd-dm-delays:
    type: array
    description: |
      Data masks 0 and 1, in delay taps (0 through 23, approximately 350 ps each).
      Must contain exactly 2 entries.

  dm-oe-n-delays:
    type: array
    description: |
      Data-mask output-enable lines 0 and 1, in delay taps (0 through 23, approximately 350 ps each).
      Must contain exactly 2 entries.

  ss-n-delays:
    type: array
    description: |
      Chip selects 0 and 1, in delay taps (0 through 23, approximately 350 ps each).
      Must contain exactly 2 entries.

  sclk-delay:
    type: int
    description: |
      Serial clock, in delay taps (0 through 23, approximately 350 ps each).

  sclkn-delay:
    type: int
    description: |
      Inverted serial clock, in delay taps (0 through 23, approximately 350 ps each).

  baud2-signal-delay:
    type: int
    description: TX/RX signal delay for higher frequency
    default: 22

  tx-fifo-threshold:
    type: int
    description: transmit fifo threshold
    default: 128

  xip-wait-cycles:
    type: int
    description: waitcycles on XiP transaction
    default: 16

  xip-rxds-vl-en:
    type: boolean
    description: Enable/Disable RXDS Variable Latency on XiP transaction

  xip-base-address:
    type: array
    description: XiP memory address range

  baud2-delay:
    type: int
    description: Enable/disable BAUD2 delay. This needs to be enabled when BAUDR divisor is 2.
                 Enumerated values
                 0 - disable BAUD2 delay
                 1 - enable BAUD2 delay
                 2 - auto sets BAUD2 delay when BAUDR divisor is 2
    default: 2
    enum:
      - 0
      - 1
      - 2
