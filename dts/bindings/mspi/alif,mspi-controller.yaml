description: Alif MSPI controller with Synopsys DesignWare SSI core

compatible: "alif,mspi-controller"

include: "snps,designware-ssi.yaml"

properties:
  reg-names:
    required: true
    description: |
      Register and memory region names. The core region contains the
      DesignWare SSI registers, the xip region is the memory-mapped XiP
      window, and the aes region contains the Alif AES wrapper registers.

  ddr-drive-edge:
    type: int
    default: 1
    description: TXD drive edge setting for DDR operation.

  rx-ds-delay:
    type: int
    default: 16
    description: Receive data strobe delay.

  baud2-delay:
    type: int
    default: 2
    enum:
      - 0
      - 1
      - 2
    description: BAUD2 delay control used by the Alif OSPI/MSPI wrapper.

  xip-wait-cycles:
    type: int
    default: 16
    description: Wait cycles for XiP transactions.

  xip-rxds-vl-en:
    type: boolean
    description: Enable RXDS variable latency on XiP transactions.

  xip-ser-support:
    type: boolean
    description: |
      Controller implements the XIP slave-enable register. When present,
      the driver may select an XIP target through the XIPSER register.

  memmap-write-support:
    type: boolean
    description: Controller supports memory-mapped write/XiP write registers.

  hyperbus-mode:
    type: boolean
    description: |
      Configure the memory-mapped read and write paths for the HyperBus
      protocol. This mode is intended for a controller instance connected
      to a HyperRAM device.

  hyperbus-dfs:
    type: int
    default: 16
    enum:
      - 16
      - 32
    description: |
      Data frame size in bits used for memory-mapped HyperBus transfers.
