description: Synopsys DesignWare I2S node

compatible: "snps,designware-i2s"

include: [base.yaml,pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  dmas:
    description: |
      Optional TX and/or RX DMA channel specifiers. If provided, DMA will be
      used for data transfer instead of interrupt-driven FIFO access.
      Requires CONFIG_I2S_DW_USE_DMA to be enabled.
      If both TX and RX channels are specified they must use the same DMA
      controller; the driver stores a single dma_dev pointer.

  dma-names:
    description: |
      DMA channel names. Must be "txdma" for transmit and/or "rxdma" for receive.

  tx-fifo-watermark:
    type: int
    default: 8
    description: |
      TX FIFO trigger level (0-15). An interrupt is generated when the number
      of entries in the TX FIFO is at or below this value. Default is 8
      (half of the 16-entry FIFO depth).

  rx-fifo-watermark:
    type: int
    default: 8
    description: |
      RX FIFO trigger level (0-15). An interrupt is generated when the number
      of entries in the RX FIFO is at or above this value. Default is 8
      (half of the 16-entry FIFO depth).
