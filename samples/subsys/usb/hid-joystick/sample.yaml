sample:
  name: USB HID joystick sample

common:
  harness: button
  filter: dt_alias_exists("led0")
  depends_on:
    - gpio

tests:
  sample.usb.hid-joystick:
    depends_on:
      - usb_device
    integration_platforms:
      - alif_e8_dk/ae822fa0e5597xx0/rtss_hp
      - alif_e1c_dk/ae1c1f4051920hh/rtss_he
    extra_args:
      - SNIPPET="alif-hid-joystick"
    tags:
      - usb
      - hid
      - joystick

  sample.usb_device_next.hid-joystick:
    depends_on:
      - usbd
    integration_platforms:
      - alif_e8_dk/ae822fa0e5597xx0/rtss_hp
      - alif_e1c_dk/ae1c1f4051920hh/rtss_he
    extra_args:
      - CONF_FILE="usbd_next_prj.conf"
      - SNIPPET="alif-hid-joystick"
    tags:
      - usb
      - hid
      - joystick
