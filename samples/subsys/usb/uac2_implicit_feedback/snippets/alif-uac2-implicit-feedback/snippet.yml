name: alif-uac2-implicit-feedback

append:
  EXTRA_CONF_FILE: alif-uac2-implicit.conf

boards:
  # E1C/B1 Balletto and Ensemble boards
  /alif_(b1|e1c)_dk.*/.*/rtss_he/:
    append:
      EXTRA_DTC_OVERLAY_FILE: alif_balletto_dk.overlay

  # E8 Ensemble boards
  /alif_e8_dk.*/.*/rtss_(hp|he)/:
    append:
      EXTRA_DTC_OVERLAY_FILE: alif_ensemble_e8_dk.overlay
