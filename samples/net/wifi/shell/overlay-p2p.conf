# P2P autonomous GO overlay (keep board .conf STA/AP-shaped).
#
#   west build -b alif_e8_dk/ae822fa0e5597xx0/rtss/hp samples/net/wifi/shell \
#     -- -DEXTRA_CONF_FILE=overlay-p2p.conf
#
# SSID/PSK/device name: CONFIG_AIROC_WIFI_P2P_* (defaults DIRECT-Al / 12345678).

CONFIG_AIROC_WIFI_P2P=y
CONFIG_WIFI_MGMT_P2P=y
CONFIG_WIFI_P2P_MAX_PEERS=16
CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_NET_DHCPV4_SERVER=y

# Minimal mbedTLS for WPS registrar (DH + HMAC-SHA256 + AES-CBC)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CBC_ENABLED=y
CONFIG_MBEDTLS_MD=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_DHM_C=y
CONFIG_MBEDTLS_CTR_DRBG_ENABLED=n
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=n
CONFIG_ENTROPY_GENERATOR=y
